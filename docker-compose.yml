# Runs the whole product on one machine: database, backend and website.
#   1. cp .env.docker.example .env      (then fill in the secrets)
#   2. docker compose up -d --build
#   3. open http://localhost:3000
# Optional services (AI, email, billing, connected apps) switch on by filling in their variables in .env.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-tenemsa}
      POSTGRES_USER: ${DATABASE_USERNAME:-tenemsa}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
    volumes:
      - tenemsa-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-tenemsa} -d ${DB_NAME:-tenemsa}"]
      interval: 10s
      timeout: 5s
      retries: 6

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-tenemsa}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-tenemsa}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -base64 64)}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DDL_AUTO: ${DDL_AUTO:-update}
      FLYWAY_ENABLED: "true"
      RATE_LIMIT_TRUST_PROXY: ${RATE_LIMIT_TRUST_PROXY:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      CLOUD_NAME: ${CLOUD_NAME:-}
      API_KEY: ${API_KEY:-}
      API_SECRET: ${API_SECRET:-}
      AI_PROVIDER: ${AI_PROVIDER:-none}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      CONNECTIONS_SECRET: ${CONNECTIONS_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CONNECT_CLIENT_ID: ${GOOGLE_CONNECT_CLIENT_ID:-}
      GOOGLE_CONNECT_CLIENT_SECRET: ${GOOGLE_CONNECT_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${BACKEND_URL:-http://localhost:8080}
        VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-}
        VITE_LEGAL_NAME: ${VITE_LEGAL_NAME:-}
        VITE_LEGAL_ADDRESS: ${VITE_LEGAL_ADDRESS:-}
        VITE_GOVERNING_LAW: ${VITE_GOVERNING_LAW:-India}
        VITE_LEGAL_REVIEWED: ${VITE_LEGAL_REVIEWED:-false}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  tenemsa-db:
