spring.application.name=Tenemsa-backend

server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# Database selection — one profile per database, switched by a single setting:
#   SPRING_PROFILES_ACTIVE=postgres   (default)  -> application-postgres.properties
#   SPRING_PROFILES_ACTIVE=mysql                 -> application-mysql.properties
# Datasource URL/driver live ONLY in those two files. Everything else (this
# file) is database-independent. The Hibernate dialect is auto-detected from
# the driver — do not set spring.jpa.properties.hibernate.dialect by hand.
# ---------------------------------------------------------------------------
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

# Schema migrations (Flyway). The database structure is defined by the versioned files in
# src/main/resources/db/migration/{postgresql|mysql}. A database created before Flyway
# existed is baselined at version 1 automatically (nothing is re-created), then newer
# migrations run. Set FLYWAY_ENABLED=false to switch it off.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration/{vendor}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JPA configuration. "update" stays the default so nothing breaks while you switch over;
# once Flyway is running everywhere set DDL_AUTO=validate (Hibernate then only CHECKS the
# schema against the entities and never changes it). See docs/database.md.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true

app.email.enabled=true

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}


spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT — never hardcode this in source. Generate a strong random value, e.g.:
#   openssl rand -base64 64
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# Refresh tokens: opaque random strings, hashed before storage (see
# TokenService) — not JWTs, specifically so they can be revoked by DB lookup
# (logout / logout-all-devices need real revocation, which a stateless JWT
# can't provide without a separate blocklist anyway).
app.refresh-token.expiration-days=${REFRESH_TOKEN_EXPIRATION_DAYS:30}
app.refresh-token.remember-me-expiration-days=${REMEMBER_ME_EXPIRATION_DAYS:90}

# Verification/reset tokens (email verification, forgot password) — also
# opaque + hashed, short-lived.
app.verification-token.expiration-minutes=${VERIFICATION_TOKEN_EXPIRATION_MINUTES:30}

# Used to build links in emails (verification, password reset) and as the
# OAuth2 redirect target — the backend has no other way to know where the
# frontend is deployed.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# CORS — comma-separated list of allowed frontend origins.
# Defaults to local Vite dev server + the deployed Vercel frontend.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Google OAuth2 (optional) — see OAuth2ClientConfig.java for how
# GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET (read directly as env vars, no
# properties-file mapping needed) make Google login conditionally available.

# Rate limiting on public endpoints (see RateLimitFilter). Set TRUST_PROXY=true only
# behind a reverse proxy that appends the client address to X-Forwarded-For.
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.trust-proxy=${RATE_LIMIT_TRUST_PROXY:false}

cloudinary.cloud-name=${CLOUD_NAME}
cloudinary.api-key=${API_KEY}
cloudinary.api-secret=${API_SECRET}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
