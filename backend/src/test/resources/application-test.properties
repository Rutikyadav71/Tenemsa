# Used only by the integration tests (@ActiveProfiles("test")).
# In-memory H2 in MySQL mode: no external database or .env file needed.
spring.datasource.url=jdbc:h2:mem:tenemsa-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# The tests build their H2 schema from the entities; the Flyway files target MySQL/PostgreSQL.
spring.flyway.enabled=false
spring.jpa.show-sql=false

# Every placeholder application.properties would otherwise read from the environment.
app.email.enabled=false
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test
jwt.secret=dGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQtdGVzdA==
jwt.expiration-ms=900000
cloudinary.cloud-name=test
cloudinary.api-key=test
cloudinary.api-secret=test

# Integration tests register and sign in many times from one address; rate limiting
# has its own dedicated test (RateLimitTest), which switches it back on.
app.rate-limit.enabled=false

# AI stays off in tests: no model, no key. Tests that need AI replace the AiClient bean with a mock.
ai.provider=none

# Knowledge base: index inline (no background thread) and never contact an embedding service.
kb.embedding-provider=none
kb.gemini-api-key=
kb.async=false
kb.vector-store=scan
kb.min-score=0.30
